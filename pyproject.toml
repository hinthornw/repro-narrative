[project]
name = "repro-narrative"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.0",
    "uvicorn>=0.32.0",
    "langserve>=0.3.1",
    "python-decouple>=3.8",
    "mypy>=1.10.0",
    "poetry-dotenv-plugin>=0.2.0",
    "python-dotenv>=1.0.1",
    "langchain-openai>=0.3.12",
    "langchain-core>=0.3.28",
    "langchain>=0.3.23",
    "pydantic>=2.5.2",
    "aiosqlite>=0.20.0",
    "langchain-anthropic>=0.3.10",
    "graphviz>=0.20.3",
    "langgraph-checkpoint-postgres>=2.0.3",
    "psycopg[binary,pool]>=3.2.1",
    "langchain-experimental>=0.3.3",
    "pandas>=2.2.3",
    "tabulate>=0.9.0",
    "apscheduler>=3.11.0",
    "weaviate-client>=4.10.2",
    "langchain-together>=0.3.0",
    "langsmith>=0.3.38",
    "fastapi>=0.115.2",
    "langchain-google-vertexai>=2.0.20",
    "aiofiles>=24.1.0",
    "fastcore>=1.8.1",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.2",
    "pre-commit>=4.0.1",
    "fire>=0.7.0",
    "pyspy>=0.1.1",
]

[tool.setuptools]
packages = ["app"]
[tool.setuptools.package-dir]
"app" = "app"
